<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numeric Validation App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl border border-slate-700/60 p-6 sm:p-8 transition-all">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-white tracking-tight">Numeric Validation</h1>
            <p class="text-slate-400 text-sm mt-1">Verify numeric inputs with instant visual feedback.</p>
        </div>

        <!-- Form Block -->
        <form id="numericForm" class="space-y-5" onsubmit="return false;">
            <div>
                <label for="numberInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
                    Enter a number (1 &ndash; 100)
                </label>
                <div class="relative rounded-lg shadow-sm">
                    <input 
                        type="number" 
                        id="numberInput" 
                        name="numberInput"
                        placeholder="e.g. 42"
                        step="any"
                        min="1"
                        max="100"
                        class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-lg text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200"
                        required
                    >
                </div>
            </div>

            <!-- Submit Button -->
            <button 
                type="button" 
                id="submitBtn" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium py-3 px-4 rounded-lg shadow-lg shadow-indigo-600/30 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-slate-800"
            >
                Validate Input
            </button>
        </form>

        <!-- Feedback Message Box -->
        <div id="feedbackContainer" class="mt-6 hidden p-4 rounded-lg border text-sm flex items-start space-x-3 transition-all duration-300">
            <svg id="feedbackIcon" class="w-5 h-5 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <!-- Dynamic SVG path loaded via JS -->
            </svg>
            <span id="errorMessage" class="leading-relaxed"></span>
        </div>

        <div>
            <p>Return to the main, ugly-looking page <a href="numeric_validation.html" class="text-indigo-400 hover:text-indigo-300">here</a>.</p>
        </div>
    </main>

    <script>
        // DOM Element references
        const numberInput = document.getElementById('numberInput');
        const submitBtn = document.getElementById('submitBtn');
        const feedbackContainer = document.getElementById('feedbackContainer');
        const errorMessage = document.getElementById('errorMessage');
        const feedbackIcon = document.getElementById('feedbackIcon');

        // SVG Path Strings for Icons
        const successIconPath = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>`;
        const errorIconPath = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>`;

        // Validation Handler
        function validateInput() {
            const val = parseFloat(numberInput.value);

            feedbackContainer.classList.remove('hidden', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-300', 'bg-rose-500/10', 'border-rose-500/30', 'text-rose-300');

            if (!isNaN(val) && val >= 1 && val <= 100) {
                // Success state
                errorMessage.textContent = `Valid input! "${val}" is within the range [1, 100].`;
                feedbackContainer.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-300');
                feedbackIcon.innerHTML = successIconPath;
            } else {
                // Error state
                if (isNaN(val)) {
                    errorMessage.textContent = 'Please enter a valid numeric value.';
                } else {
                    errorMessage.textContent = `Invalid number (${val}). Value must be between 1 and 100.`;
                }
                feedbackContainer.classList.add('bg-rose-500/10', 'border-rose-500/30', 'text-rose-300');
                feedbackIcon.innerHTML = errorIconPath;
            }
        }

        // Event Listeners
        submitBtn.addEventListener('click', validateInput);

        // Allow pressing Enter key to trigger validation
        numberInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                validateInput();
            }
        });
    </script>
</body>
</html>
