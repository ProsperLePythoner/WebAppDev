<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouseover, Mouseout</title>
</head>

<style>
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
    }

    #mouseArea {
        width: 250px;
        height: 250px;
        background-color: lightskyblue;
        padding: 1rem;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
</style>
<body>
    <h1>Mouseover and Mouseout Events</h1>
    <div id="mouseArea">
        <p id="mouseAreaText">Hover over this area to see the effect.</p>
    </div>

    <script>
        const mouseArea = document.getElementById("mouseArea");
        const mouseAreaText = document.getElementById("mouseAreaText");

        mouseArea.addEventListener("mouseover", () => {
            mouseArea.style.transition = "background-color 0.5s ease";
            mouseArea.style.backgroundColor = "lightgreen";
            mouseAreaText.innerHTML = "Mouse is over the area!";
        });

        mouseArea.addEventListener("mouseout", () => {
            mouseArea.style.backgroundColor = "lightskyblue";
            mouseAreaText.innerHTML = "Mouse is not over the area.";
        });
    </script>
</body>
</html>
